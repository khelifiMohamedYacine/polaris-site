# Render Blueprint — https://render.com/docs/blueprint-spec
# Values marked `sync: false` are entered once in the Render dashboard and are
# never stored in this file.
databases:
  - name: polaris-db
    plan: free
    region: frankfurt
    databaseName: polaris
    user: polaris

services:
  - type: web
    name: polaris-construction
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: polaris-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFICATION_EMAIL_FROM
        sync: false
      - key: NOTIFICATION_EMAIL_TO
        sync: false
